name: Publiceer Contactmanager PRO (e-mail-only CSV)
on:
  push:
    paths:
      - ".github/workflows/publish-contactmanager-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Nieuwe gebouwde Contactmanager laden
        env:
          BUILD_ARCHIVE_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-a210-8210-9144-3e2913714140/raw?se=2026-11-07T09%3A33%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=02254e98-234f-5c3e-bd85-13ba2cc075f7&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-07T07%3A53%3A53Z&ske=2026-11-08T07%3A53%3A53Z&sks=b&skv=2026-02-06&sig=38uzk8I3IalFe65LW9EGfVE1yR4tgzkBMW5/EV/h8Ls%3D'
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 "$BUILD_ARCHIVE_URL" -o /tmp/cm.zip
          mkdir -p /tmp/cm
          unzip -q /tmp/cm.zip -d /tmp/cm
          test -s /tmp/cm/artifact.tar
          mkdir -p contactmanager
          tar -xf /tmp/cm/artifact.tar -C contactmanager
          test -s contactmanager/index.html
          test -s contactmanager/manifest.webmanifest
          ls contactmanager/assets/*.js > /dev/null
      - name: Publiceer nieuwe versie in bestaande JS Planner Pages-map
        run: |
          git config user.name "JS Legal Force website-deploy"
          git config user.email "actions@users.noreply.github.com"
          git add contactmanager/
          if ! git diff --cached --quiet; then
            git commit -m "Contactmanager: Google CSV bevat alleen e-mailadressen"
            git push
          fi

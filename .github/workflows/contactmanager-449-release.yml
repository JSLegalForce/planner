name: Publiceer compleet gemeenteadressenbestand

on:
  push:
    paths:
      - ".github/workflows/contactmanager-449-release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download geteste website, zonder lokale browsercontacten
        env:
          RELEASE_ARCHIVE: 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-15dc-820a-b3cb-385ac985de7f/raw?se=2026-11-07T11%3A42%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=12a316ff-c62d-50e1-a245-b936748075a9&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-07T10%3A50%3A27Z&ske=2026-11-08T10%3A50%3A27Z&sks=b&skv=2026-02-06&sig=snW3PjhWFS%2BCHNlhbaCytg09XUCj1RwjT0nRN8lhPiA%3D'
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 "$RELEASE_ARCHIVE" -o /tmp/cm-release.zip
          mkdir -p /tmp/cm-artifact
          unzip -q /tmp/cm-release.zip -d /tmp/cm-artifact
          test -s /tmp/cm-artifact/artifact.tar
          mkdir -p contactmanager
          tar -xf /tmp/cm-artifact/artifact.tar -C contactmanager
          test -s contactmanager/index.html
          test -s contactmanager/manifest.webmanifest
          find contactmanager/assets -maxdepth 1 -name 'index-*.js' | grep -q .
      - name: Alleen Contactmanager-site bijwerken
        run: |
          git config user.name "JS Legal Force website-deploy"
          git config user.email "actions@users.noreply.github.com"
          git add contactmanager/
          if ! git diff --cached --quiet; then
            git commit -m "Contactmanager: herstel alle 449 eerder gevonden gemeentelijke contactregels"
            git push
          fi

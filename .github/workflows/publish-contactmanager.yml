name: Publiceer Contactmanager PRO naar GitHub Pages

on:
  push:
    paths:
      - ".github/workflows/publish-contactmanager.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bestaande JS Planner-site
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download uitsluitend de gebouwde app
        env:
          BUILD_ARCHIVE_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-0a78-81f4-8c13-493589fcb9dc/raw?se=2026-11-07T09%3A10%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=3b845ff4-d290-5e0c-bf53-80d11c0e15c8&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-07T08%3A12%3A36Z&ske=2026-11-08T08%3A12%3A36Z&sks=b&skv=2026-02-06&sig=r1u9TkkAF/s9xDbRabUbcsH0vq56iKb8xc0op2y23wQ%3D'
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 "$BUILD_ARCHIVE_URL" --output /tmp/contactmanager.zip
          mkdir -p /tmp/cm_artifact
          unzip -q /tmp/contactmanager.zip -d /tmp/cm_artifact
          test -f /tmp/cm_artifact/artifact.tar
          mkdir -p contactmanager
          tar -xf /tmp/cm_artifact/artifact.tar -C contactmanager
          test -f contactmanager/index.html
          test -f contactmanager/manifest.webmanifest
          test -f contactmanager/assets/index-C_7blLC_.js
          echo "Contactmanager bestanden klaar."
      - name: Publiceer zonder bestaande Planner-bestanden aan te passen
        run: |
          git config user.name "JS Legal Force website-deploy"
          git config user.email "actions@users.noreply.github.com"
          git add contactmanager/
          if git diff --cached --quiet; then
            echo "Geen nieuwe wijzigingen."
          else
            git commit -m "Publiceer Contactmanager PRO in aparte Pages-map"
            git push
          fi

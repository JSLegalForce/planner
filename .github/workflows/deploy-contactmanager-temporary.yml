name: Publiceer verbeterde Contactmanager PRO

on:
  push:
    paths:
      - ".github/workflows/deploy-contactmanager-temporary.yml"

permissions:
  contents: write

concurrency:
  group: contactmanager-pages-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download geteste build, zonder privécontacten
        env:
          ARCHIVE_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-2b6c-8210-8ad4-4b374a3de651/raw?se=2026-11-07T10%3A21%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=14625594-0f1b-5958-8f96-53bbf9c22797&skoid=c30e7ce7-1f51-4051-a377-288cdba21c02&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-07T08%3A51%3A17Z&ske=2026-11-08T08%3A51%3A17Z&sks=b&skv=2026-02-06&sig=BqbP%2BCXApgcO6eYI/jKHPyNisFjZL%2B/hTn01umCdXmE%3D'
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 "$ARCHIVE_URL" -o /tmp/contactmanager.zip
          mkdir -p /tmp/cm-artifact
          unzip -q /tmp/contactmanager.zip -d /tmp/cm-artifact
          test -f /tmp/cm-artifact/artifact.tar
          mkdir -p contactmanager
          tar -xf /tmp/cm-artifact/artifact.tar -C contactmanager
          test -s contactmanager/index.html
          test -s contactmanager/manifest.webmanifest
          find contactmanager/assets -maxdepth 1 -name 'index-*.js' | grep -q .
          echo "Geteste build is overgenomen in contactmanager/"
      - name: Commit alleen de gebouwde website
        run: |
          git config user.name "JS Legal Force website-deploy"
          git config user.email "actions@users.noreply.github.com"
          git add contactmanager/
          if ! git diff --cached --quiet; then
            git commit -m "Contactmanager: verbeterde CSV, opslag en gemeentelijke basisset"
            git push
          else
            echo "De website is al actueel."
          fi
